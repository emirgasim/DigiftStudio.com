<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Shop Digift Studio digital invitations, personalized gifts, interactive experiences and creative templates."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="icon" href="/assets/digift-logo-transparent.png" type="image/png"><link rel="stylesheet" href="/styles.css"><title>Shop | Digift Studio</title></head>
<body>
<header class="site-header"><a class="brand brand-logo" href="/"><img src="/assets/digift-logo-transparent.png" alt="Digift Studio" width="132" height="132"></a><nav class="desktop-nav"><a href="/">Home</a><a href="/shop/" aria-current="page">Shop</a><a href="/#collections">Collections</a><a href="/#how-it-works">How It Works</a></nav><details class="mobile-nav"><summary>Menu</summary><div class="mobile-nav-panel"><a href="/">Home</a><a href="/shop/">Shop</a><a href="/#collections">Collections</a><a href="/#how-it-works">How It Works</a></div></details></header>
<main><section class="shop-hero"><p class="eyebrow">DIGIFT STUDIO SHOP</p><h1>Digital products for meaningful moments.</h1><p>Browse the live Digift Studio catalog. Product information is synced from Etsy.</p></section>
<section class="shop-toolbar"><div id="filters" class="filter-list"><button class="filter active" data-category="">All Products</button></div><span id="catalog-count"></span></section>
<section class="section section-shop"><div id="shop-products" class="catalog-root"><div class="catalog-loading">Loading products…</div></div></section></main>
<footer><div><a class="brand footer-logo" href="/"><img src="/assets/digift-logo-transparent.png" alt="Digift Studio" width="150" height="150"></a><p>Personalized digital experiences.</p></div><div class="footer-links"><a href="/">Home</a><a href="https://www.etsy.com/shop/DigiftStudio" target="_blank" rel="noopener">Etsy Shop</a></div></footer>
<script src="/catalog.js"></script><script>
(async()=>{try{const data=await DigiftCatalog.loadCatalog(),products=data.products||[],filters=document.getElementById("filters"),root=document.getElementById("shop-products"),count=document.getElementById("catalog-count");const cats=[...new Set(products.map(DigiftCatalog.categoryFor))];filters.insertAdjacentHTML("beforeend",cats.map(c=>'<button class="filter" data-category="'+esc(c)+'">'+esc(c)+'</button>').join(""));count.textContent=products.length+" products";function render(cat){const list=cat?products.filter(p=>DigiftCatalog.categoryFor(p)===cat):products;root.innerHTML=list.length?'<div class="product-grid">'+list.map(card).join("")+'</div>':'<div class="catalog-empty">No products in this collection yet.</div>';document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.category===cat))}filters.addEventListener("click",e=>{const b=e.target.closest(".filter");if(b)render(b.dataset.category)});const requested=new URLSearchParams(location.search).get("category")||"";render(cats.includes(requested)?requested:"")}catch(e){document.getElementById("shop-products").innerHTML='<div class="catalog-empty">Catalog temporarily unavailable.</div>'}function card(p){const image=DigiftCatalog.firstImage(p),href=DigiftCatalog.productUrl(p);return '<article class="product-card"><a class="product-media" href="'+href+'">'+(image?'<img src="'+image+'" alt="'+esc(p.title)+'" loading="lazy">':'<div class="media-placeholder">DIGIFT</div>')+'</a><div class="product-info"><p class="product-category">'+esc(DigiftCatalog.categoryFor(p))+'</p><h3><a href="'+href+'">'+esc(p.title)+'</a></h3><div class="product-bottom"><span>'+DigiftCatalog.money(p.price,p.currency_code)+'</span><a class="product-link" href="'+href+'">View →</a></div></div></article>'}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}})();
</script></body></html>
